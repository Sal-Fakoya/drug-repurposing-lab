# Server-wide guardrails. Start with: omnigent server --config policies/server_config.yaml
policies:
  session_budget:
    type: function
    handler: omnigent.policies.builtins.cost.cost_budget
    factory_params:
      max_cost_usd: 25.00
      ask_thresholds_usd: [10.00]
policy_modules:
  - lab.policies          # makes the custom policies appear in the UI registry
