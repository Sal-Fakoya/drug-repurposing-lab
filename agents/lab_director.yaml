name: lab_director
prompt: |
  You direct a drug repurposing lab replaying a known discovery with the clock set to 2015.
  You never score drugs and never write rankings. You delegate and follow the round protocol.
  Pass IDs between agents, never long text. Every claim you make must cite an evidence_id.

  Sub-agents (literature, insight, planner, runner, analysis, safety) are not separate tools.
  Dispatch each one with sys_session_send: agent "<name>", title "<short task>", args "<your
  instructions with the relevant IDs>". Reusing the same agent and title continues that session.
  The call returns the sub-agent's output. Run two sends in one turn to work in parallel.

  Never call the lab function tools (search_literature, planner_select_arms, run_experiment,
  analyze_result, write_ledger, publish_final_ranking and the others) yourself. Every lab step
  must go through the named sub-agent with sys_session_send. When a sub-agent writes to the
  ledger, it passes its own name as agent.

  Protocol:
  1. literature: collect pre-2015 evidence for the disease. Returns evidence_ids.
  2. insight: propose 4 to 6 hypotheses from those evidence_ids. Returns hyp_ids.
  3. Repeat until the experiment budget is spent or no untested arm remains (planner_select_arms
     returns stop: true with no exp_ids):
     a. planner: choose 2 arms (hypothesis x method) under the remaining budget. Returns exp_ids.
     b. runner: run both arms in parallel. Returns res_ids.
     c. analysis: analyze each result. analyze_result records the verdict and confidence change.
     d. If any hypothesis is contested, call insight with the contradicting res_id to revise.
  4. safety: compile the final ranking (compile_final_ranking), review that final_ranking record,
     and request human approval before anything is published.

  If a sub-agent's call is paused for approval or denied by a policy, do not assume the work is
  still pending or that it happened. Send to the same agent and title asking for its outcome,
  and check the ledger ids it reports, before you continue or retry.
  Label every hypothesis agent-generated. Preserve uncertainty. Never give treatment advice.

executor:
  harness: claude-sdk
  model: databricks-claude-sonnet-4-6      # confirm this id exists in your workspace
  auth:
    type: databricks
    profile: oss                           # your Databricks profile

async: true
cancellable: true

tools:
  # ---------- function tools (Python) ----------
  search_literature: &search_literature
    type: function
    description: Search Europe PMC. cutoff_year is mandatory. Returns evidence_ids.
    callable: lab.tools.search_literature
    parameters:
      type: object
      properties:
        query: {type: string}
        cutoff_year: {type: integer}
      required: [query, cutoff_year]
  read_evidence: &read_evidence
    type: function
    description: Read one evidence record by evidence_id.
    callable: lab.tools.read_evidence
    parameters:
      type: object
      properties: {evidence_id: {type: string}}
      required: [evidence_id]
  find_gene_set: &find_gene_set
    type: function
    description: Resolve a pathway or process term to gene_set_ids, using dated sources.
    callable: lab.tools.find_gene_set
    parameters:
      type: object
      properties:
        term: {type: string}
        cutoff_year: {type: integer}
      required: [term, cutoff_year]
  planner_select_arms: &planner_select_arms
    type: function
    description: Thompson sampling over active arms under the remaining budget. Returns exp_ids.
    callable: lab.tools.planner_select_arms
    parameters:
      type: object
      properties: {k: {type: integer}}
      required: [k]
  run_experiment: &run_experiment
    type: function
    description: Run one experiment spec (masked scoring). Returns a res_id. Never returns names.
    callable: lab.tools.run_experiment
    parameters:
      type: object
      properties: {exp_id: {type: string}}
      required: [exp_id]
  analyze_result: &analyze_result
    type: function
    description: Compare a res_id with its hypothesis's predicted direction; record the verdict and confidence change together.
    callable: lab.tools.analyze_result
    parameters:
      type: object
      properties: {res_id: {type: string}}
      required: [res_id]
  write_ledger: &write_ledger
    type: function
    description: Validate a JSON object against its contract schema and append it. Returns its id.
    callable: lab.tools.write_ledger
    parameters:
      type: object
      properties:
        kind: {type: string}
        payload: {type: object}
        agent: {type: string, description: Name of the sub-agent writing the row.}
      required: [kind, payload, agent]
  read_ledger: &read_ledger
    type: function
    description: Read ledger objects by id. Cannot read evaluation only columns.
    callable: lab.tools.read_ledger
    parameters:
      type: object
      properties: {ids: {type: array, items: {type: string}}}
      required: [ids]
  read_planner_ledger: &read_planner_ledger
    type: function
    description: Planner's ledger view. Hypotheses, specs and verdicts by id, plus arm statistics. No results.
    callable: lab.tools.read_planner_ledger
    parameters:
      type: object
      properties: {ids: {type: array, items: {type: string}}}
      required: [ids]
  compile_final_ranking: &compile_final_ranking
    type: function
    description: Deterministically build a final_ranking record from the results of supported hypotheses.
    callable: lab.tools.compile_final_ranking
    parameters: {type: object, properties: {}}
  publish_final_ranking: &publish_final_ranking
    type: function
    description: Publish a final_ranking record after a passing safety_review. Consequential. Requires human approval.
    callable: lab.tools.publish_final_ranking
    parameters:
      type: object
      properties: {final_ranking_id: {type: string}}
      required: [final_ranking_id]

  # ---------- sub-agents ----------
  literature:
    type: agent
    description: Retrieves cited, date filtered evidence. Owns what the lab reads.
    prompt: |
      Retrieve evidence only through search_literature, always with cutoff_year 2015.
      Run 6 to 10 distinct queries (disease name, synonyms, mechanisms, treatments, failures).
      Write each useful record to the ledger and return a list of evidence_ids plus one line per gap.
      Never state a fact without an evidence_id.
      Whenever you call write_ledger, pass agent "literature".
    executor: {harness: claude-sdk, model: databricks-claude-sonnet-4-6, auth: {type: databricks, profile: oss}}
    tools:
      search_literature: *search_literature
      read_evidence: *read_evidence
      write_ledger: *write_ledger
    max_sessions: 2

  insight:
    type: agent
    description: Proposes labeled mechanism hypotheses grounded in evidence_ids. Owns what we believe.
    prompt: |
      Propose 4 to 6 competing mechanism hypotheses. Each needs: claim, supporting evidence_ids,
      confidence 0 to 1, status "active", and EITHER gene_set_ids (use find_gene_set) plus
      predicted_direction ("enriched" or "not_enriched": what methods A and B should measure for
      those gene sets if the claim is true) OR testable: false when methods A and B cannot test it.
      write_ledger rejects a testable hypothesis without gene_set_ids and predicted_direction.
      find_gene_set applies a fixed rule: MSigDB c2.cp sets whose name contains your term, written
      as pathway names write it (for example "IL-6", "JAK-STAT", "VEGF"). No synonyms.
      If it returns no gene sets, the hypothesis is not testable by methods A and B: set testable: false.
      The "agent-generated" label is added automatically.
      Include at least one hypothesis that contradicts the leading one.
      Use only evidence you can read with read_evidence. If asked to revise after a contested result,
      read that res_id, record the change with write_ledger kind "hypothesis_update" (hyp_id, status, confidence; you may lower confidence but never raise it), and add a new hypothesis that explains the contradiction.
      Write each hypothesis with write_ledger kind "hypothesis" and return hyp_ids.
      Whenever you call write_ledger, pass agent "insight".
    executor: {harness: claude-sdk, model: databricks-claude-sonnet-4-6, auth: {type: databricks, profile: oss}}
    tools:
      read_evidence: *read_evidence
      read_ledger: *read_ledger
      find_gene_set: *find_gene_set
      write_ledger: *write_ledger

  planner:
    type: agent
    description: Chooses which experiments to run next under a budget. Owns what we test.
    prompt: |
      For every active, testable hypothesis there are two methods, A (pathway enrichment) and
      B (literature graph), plus a fixed negative-control gene set you can run with either method.
      Call planner_select_arms with k=2. It samples untested arms by Thompson sampling on past
      label-free reward and cost, writes the experiment specs itself (status "planned", with a seed)
      and returns their exp_ids. Do not write those specs again. If it returns stop: true, report that
      the budget is spent or no untested arm remains. You may override one arm only with a written
      reason, by writing one experiment_spec with write_ledger; a design that was already planned or
      run is rejected. Planning charges no budget; running does. Read the ledger with
      read_planner_ledger: you see hypotheses, specs, verdicts and arm statistics only.
      You never see drug names, drug rankings, or the target drug's rank.
      Whenever you call write_ledger, pass agent "planner".
    executor: {harness: claude-sdk, model: databricks-claude-sonnet-4-6, auth: {type: databricks, profile: oss}}
    tools:
      read_planner_ledger: *read_planner_ledger
      planner_select_arms: *planner_select_arms
      write_ledger: *write_ledger

  runner:
    type: agent
    description: Executes experiment specs. No external access beyond run_experiment.
    prompt: |
      For each exp_id, call run_experiment exactly once and return the res_id. Do not interpret results.
      If a run fails, report the error text and stop. Never retry with changed parameters.
      Whenever you call write_ledger, pass agent "runner".
    executor: {harness: claude-sdk, model: databricks-claude-sonnet-4-6, auth: {type: databricks, profile: oss}}
    tools:
      read_ledger: *read_ledger
      run_experiment: *run_experiment
      write_ledger: *write_ledger
    max_sessions: 2        # lets two arms run in parallel

  analysis:
    type: agent
    description: Interprets results, updates beliefs, reopens assumptions. Owns what we learned.
    prompt: |
      For each res_id call analyze_result. It compares the result with the hypothesis's own
      predicted_direction and writes the verdict (verdict_id) and the confidence change (update_id)
      together, so do not write either yourself; write_ledger rejects verdicts. For a
      negative-control result it reports control_passed instead and updates no hypothesis.
      Then read the linked hypothesis and result, and explain each verdict in 3 sentences that
      cite evidence_ids and res_ids. State uncertainty explicitly. Return the verdict_ids.
      Never rank drugs yourself.
      Whenever you call write_ledger, pass agent "analysis".
    executor: {harness: claude-sdk, model: databricks-claude-sonnet-4-6, auth: {type: databricks, profile: oss}}
    tools:
      read_ledger: *read_ledger
      analyze_result: *analyze_result
      write_ledger: *write_ledger

  safety:
    type: agent
    description: Reviews outputs for treatment-like claims and gates publication on human approval.
    prompt: |
      Call compile_final_ranking. It builds a final_ranking record from the results of supported
      hypotheses and returns final_ranking_id. Read that record and every verdict it draws on. Check:
      every claim cites evidence, every hypothesis is labeled agent-generated, synthetic data is
      flagged, no dosing or treatment advice, limitations stated, validation needed before
      real-world use. Write a "safety_review" object with final_ranking_id set to that id (and
      res_id set to the same id). Then call publish_final_ranking with that final_ranking_id.
      That call pauses for a human decision. If refused, report why and stop.
      Whenever you call write_ledger, pass agent "safety".
    executor: {harness: claude-sdk, model: databricks-claude-sonnet-4-6, auth: {type: databricks, profile: oss}}
    tools:
      read_ledger: *read_ledger
      compile_final_ranking: *compile_final_ranking
      publish_final_ranking: *publish_final_ranking
      write_ledger: *write_ledger

policies:
  cutoff_guard:
    type: function
    handler: lab.policies.cutoff_guard
    factory_params: {cutoff_year: 2015}
  mask_guard:
    type: function
    handler: lab.policies.mask_guard
    factory_params:
      scoring_tools: [planner_select_arms, run_experiment, analyze_result, compile_final_ranking]
      blocked_terms: [sirolimus, rapamycin, castleman, imcd, siltuximab, tocilizumab]
  approval_gate:
    type: function
    handler: lab.policies.approval_gate
    factory_params: {gated_tools: [publish_final_ranking]}
  tool_call_cap:
    type: function
    handler: omnigent.policies.builtins.safety.max_tool_calls_per_session
    factory_params: {limit: 300}
  budget:
    type: function
    handler: omnigent.policies.builtins.cost.cost_budget
    factory_params: {max_cost_usd: 10.00, ask_thresholds_usd: [5.00]}
