[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lab"
version = "0.1.0"
description = "Drug repurposing lab: tools, scoring, ledger and policies for Omnigent agents"
requires-python = ">=3.10"
dependencies = ["numpy", "jsonschema"]

[project.optional-dependencies]
data = ["pandas", "pyarrow"]  # scripts/build_snapshots.py
dev = ["pytest", "ruff", "pyyaml", "matplotlib", "pandas", "pyarrow"]

[tool.setuptools.packages.find]
include = ["lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # lets tests import the experiments package

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]  # explicit: a newer ruff cannot add surprise rules to CI
